<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Jerremy Beron | AI Automation Specialist</title>
    <meta data-static-meta name="description" content="AI-powered workflows that connect your tools, automate repetitive tasks, and improve lead follow-up and appointment booking." />
    <!-- Optional brand icons are preserved for when an identity is chosen.
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    -->
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0A0A0A" />

    <meta property="og:type" content="website" />
    <!-- Add og:url, og:image and twitter:image after choosing the final public URL.
         Keep the optional site identity unset until a brand is chosen. -->
    <meta property="og:title" content="Jerremy Beron | AI Automation Specialist" />
    <meta property="og:description" content="AI-powered workflows that connect your tools, automate repetitive tasks, and improve lead follow-up and appointment booking." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jerremy Beron, AI Automation Specialist" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dark by default; a saved light pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F0F8FF')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
